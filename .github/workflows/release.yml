name: Release

# Se dispara SOLO con un tag semver. El tag es la unica fuente de verdad de la
# version: se inyecta en el binario con -ldflags y da nombre al instalador.
#
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a compilar (sin la v), p.ej. 1.0.0'
        required: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # La version sale del tag (v1.0.0 -> 1.0.0) o del input manual.
      - name: Resolver version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      # Los tests de GDI/spooler solo compilan en Windows (build tags), asi que
      # este es el unico sitio donde se ejecutan de verdad.
      - name: Test
        run: go test -race ./...

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # pdftoppm.exe y pdftocairo.exe necesitan poppler.dll y el resto de DLLs:
      # se descarga el bundle de Windows y se le pasa al script de release, que
      # copia solo las que cargan (tools/popplerbundle). La version es la validada
      # en Windows 11 limpio (docs/ACCEPTANCE.md).
      #
      # El zip viene de un repositorio de terceros y sus binarios acaban
      # ejecutandose como SYSTEM en modo servicio: se verifica su SHA256 antes de
      # descomprimir. Al subir de version, actualiza los dos valores a la vez.
      - name: Descargar poppler
        shell: pwsh
        env:
          POPPLER_VERSION: '26.09.0-0'
          POPPLER_SHA256: '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0'
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip -UseBasicParsing
          $hash = (Get-FileHash poppler.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:POPPLER_SHA256) { throw "SHA256 de poppler.zip no coincide: $hash" }
          Expand-Archive poppler.zip -DestinationPath poppler-dist
          $bin = (Get-ChildItem poppler-dist -Recurse -Filter pdftoppm.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "No se encontro pdftoppm.exe en el zip de poppler" }
          # COPYING.gpl2 es la licencia de Poppler; COPYING es el aviso de poppler-data.
          $lic = (Get-ChildItem poppler-dist -Recurse -Filter COPYING.gpl2 | Select-Object -First 1).FullName
          if (-not $lic) { throw "No se encontro la licencia GPL (COPYING.gpl2) en el zip de poppler" }
          "POPPLER_BIN=$bin"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "POPPLER_LICENSE=$lic" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build + instalador
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -PopplerBin $env:POPPLER_BIN `
            -PopplerLicense $env:POPPLER_LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/TeraAgent-Setup-*.exe
            dist/tera-agent.exe
            dist/tera-agent-tray.exe
            dist/SHA256SUMS.txt

      # El release queda como borrador a proposito: publicar es lo que hace que
      # los clientes empiecen a descargar. Revisa los hashes y publica a mano.
      - name: Publicar release (borrador)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/TeraAgent-Setup-*.exe
            dist/SHA256SUMS.txt
          body: |
            Instalador de Tera Agent ${{ steps.ver.outputs.version }} para Windows.

            Verifica el binario contra `SHA256SUMS.txt` antes de publicar el
            manifiesto en `/agent/version`.

  # Binarios para Linux/macOS. No llevan instalador: en Linux se despliega con
  # la unit de systemd de deploy/systemd/.
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Resolver version
        id: ver
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          [ "$V" = "$GITHUB_REF" ] && V="${{ github.event.inputs.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          LD: -s -w -X github.com/teraerp/tera-agent/internal/infra/di.AgentVersion=${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "$LD" \
              -o "dist/tera-agent-${target%/*}-${target#*/}" ./cmd/tera-agent
          done
          (cd dist && sha256sum tera-agent-* > SHA256SUMS-unix.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: unix-release
          path: dist/
