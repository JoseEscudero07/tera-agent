name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build (host)
        run: go build ./...
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=386   go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
