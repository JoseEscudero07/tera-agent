# Tera Agent — configuración. Copia a config.yaml y ajusta.
# 'server.url' vacío = modo local (sin backend): impresión disponible por CLI.
server:
  url: ""            # ws://host:8765 o wss://erp/ws/agent/ ; vacío = modo local
  token: ""          # Token emitido por el Backend (no lo generes tú)
  insecure_skip_verify: false   # true SOLO en dev con wss y certificado self-signed
agent:
  id: ""             # identificador opcional de esta instalación
printer:
  default: "XP-80"   # impresora por defecto para los comandos
  # Calibración del corte (sin recompilar). 1mm ≈ 8 dots @203dpi.
  cut_feed_dots: 232    # avance antes del corte (default global). 0 = default interno
  top_margin_dots: 16   # filas en blanco a dejar arriba (default global). 0 = default interno
  # Overrides por impresora (cada modelo pone la cuchilla a distinta distancia):
  managed:
    - name: "XP-80"
      cut_feed_dots: 248
      top_margin_dots: 12
    # - name: "EPSON TM-T20"
    #   cut_feed_dots: 210
heartbeat:
  seconds: 30
http:
  addr: "127.0.0.1:9100"   # web service local para que Django mande PDFs; "" lo desactiva
  token: ""                # si lo pones, exige 'Authorization: Bearer <token>'
data_dir: ""         # dónde guardar estado (dedupe/pendientes); "" = por defecto del SO
log:
  level: "info"      # debug|info|warn|error
  # Ruta de log rotativo (además de stderr); "" = solo stderr. Si se indica, DEBE
  # estar dentro de data_dir: en modo servicio el agente corre como LocalSystem y
  # un log.file arbitrario sería una vía para que escribiera fuera (escalada/DoS).
  # El instalador la deja en <data_dir>/logs/tera-agent.log.
  file: ""
  max_size_mb: 5     # rota al superar este tamaño
  max_backups: 3     # nº de ficheros de respaldo
